<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("nours-theme");
          if (!saved) {
            var m = document.cookie.match(/(?:^|; )nours-theme=([^;]*)/);
            if (m) saved = decodeURIComponent(m[1]);
          }
          var theme = saved === "dark" || saved === '"dark"' ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.theme = theme;
          var rawLang = localStorage.getItem("nours-language");
          var lang = rawLang ? rawLang.replace(/^"|"$/g, "") : "en";
          if (!["en", "fr", "es", "zh", "ar"].includes(lang)) lang = "en";
          root.lang = lang;
          root.dir = lang === "ar" ? "rtl" : "ltr";
          root.classList.add("is-wx-preparing");
          setTimeout(function () { root.classList.remove("is-wx-preparing"); root.classList.add("is-wx-ready"); }, 450);
        } catch (_) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WEEXEY support, delivery information, returns, and store policies."
    />
    <title>Help & Policies | WEEXEY</title>

  </head>
