<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("nours-theme");
          if (!saved) {
            var m = document.cookie.match(/(?:^|; )nours-theme=([^;]*)/);
            if (m) saved = decodeURIComponent(m[1]);
          }
          var theme = saved === "dark" || saved === '"dark"' ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
        } catch (_) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manage your RUQO TECH profile, preferences, and orders."
    />

    <link rel="icon" type="image/png" href="/images/new/li.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/commerce.css" />
  </head>

    <script src="/js/commerce.js"></script>
  </body>
</html>
