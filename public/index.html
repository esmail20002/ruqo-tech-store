<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f0" />
    <meta
      name="description"
      content="RUQO TECH is making a few improvements. Our store will be back soon."
    />
    <title>Coming Soon | RUQO TECH</title>
    <link rel="icon" type="image/png" href="/images/ruqo-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "Manrope", sans-serif;
        color: #171a20;
        background: #f4f4f0;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        background-image: linear-gradient(#171a2009 1px, transparent 1px),
          linear-gradient(90deg, #171a2009 1px, transparent 1px);
        background-size: 44px 44px;
      }

      .page {
        display: flex;
        width: min(100% - 40px, 1160px);
        min-height: 100svh;
        flex-direction: column;
        margin-inline: auto;
      }

      .topbar,
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .topbar {
        min-height: 100px;
        border-bottom: 1px solid #171a2020;
      }

      .brand-logo {
        display: block;
        width: 168px;
        height: 84px;
        object-fit: contain;
      }

      .language-button {
        display: inline-flex;
        min-width: 92px;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border: 1px solid #171a2030;
        border-radius: 3px;
        background: #f4f4f0;
        color: inherit;
        font: 700 0.82rem "Cairo", sans-serif;
        cursor: pointer;
      }

      .language-button:hover {
        border-color: #e5663f;
        color: #b63e20;
      }

      .main {
        display: grid;
        flex: 1;
        align-content: center;
        justify-items: start;
        padding-block: 80px;
        animation: arrive 650ms ease-out both;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 26px;
        color: #b63e20;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e5663f;
        content: "";
        box-shadow: 0 0 0 4px #e5663f20;
      }

      h1 {
        max-width: 850px;
        margin: 0;
        font-size: 6rem;
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: 0;
      }

      .message {
        max-width: 540px;
        margin: 26px 0 0;
        color: #62666d;
        font-size: 1.05rem;
        line-height: 1.85;
      }

      .footer {
        min-height: 76px;
        border-top: 1px solid #171a2020;
        color: #62666d;
        font-size: 0.78rem;
      }

      .footer strong {
        color: #171a20;
        font-weight: 700;
      }

      html[lang="ar"] {
        font-family: "Cairo", sans-serif;
      }

      html[lang="ar"] .status {
        letter-spacing: 0;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 600px) {
        .page {
          width: min(100% - 32px, 1160px);
        }

        .topbar {
          min-height: 82px;
        }

        .brand-logo {
          width: 138px;
          height: 69px;
        }

        .main {
          padding-block: 64px;
        }

        h1 {
          font-size: 2.8rem;
        }

        .message {
          font-size: 0.98rem;
        }

        .footer {
          min-height: 68px;
          font-size: 0.7rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a href="/" aria-label="RUQO TECH home">
          <img class="brand-logo" src="/images/ruqo-logo.png" alt="RUQO TECH" />
        </a>
        <button class="language-button" type="button" data-language-switch>
          العربية
        </button>
      </header>

      <main class="main">
        <p class="status" data-copy="status">A little upgrade in progress</p>
        <h1 data-copy="title">A better tech experience is on its way.</h1>
        <p class="message" data-copy="message">
          We're making a few improvements. RUQO TECH will be back soon.
        </p>
      </main>

      <footer class="footer">
        <strong>RUQO TECH</strong>
        <span data-copy="footer">See you again soon.</span>
      </footer>
    </div>

    <script>
      const copy = {
        en: {
          status: "A little upgrade in progress",
          title: "A better tech experience is on its way.",
          message: "We're making a few improvements. RUQO TECH will be back soon.",
          footer: "See you again soon.",
          switch: "العربية",
          titleTag: "Coming Soon | RUQO TECH",
        },
        ar: {
          status: "نعمل على تحسين المتجر",
          title: "تجربة تقنية أفضل قريباً.",
          message: "نجري بعض التحسينات. سيعود متجر RUQO TECH قريباً.",
          footer: "نلقاكم قريباً.",
          switch: "English",
          titleTag: "قريباً | RUQO TECH",
        },
      };

      const languageSwitch = document.querySelector("[data-language-switch]");

      languageSwitch.addEventListener("click", () => {
        const language = document.documentElement.lang === "en" ? "ar" : "en";
        const languageCopy = copy[language];

        document.documentElement.lang = language;
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
        document.title = languageCopy.titleTag;
        languageSwitch.textContent = languageCopy.switch;
        document.querySelectorAll("[data-copy]").forEach((element) => {
          element.textContent = languageCopy[element.dataset.copy];
        });
      });
    </script>
  </body>
</html>
